name: Build Delfinovin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore Delfinovin.sln

    - name: Build with MSBuild
      run: msbuild Delfinovin.sln /p:Configuration=Release /p:Platform="Any CPU"
